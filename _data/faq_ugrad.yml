- question: "What do undergraduate volunteers typically do in the CHAI Lab?"
  answer: "We typically recruit volunteers to work closely with a graduate 
  student on one of their projects. We have had volunteers train machine 
  learning models on sensor data, create new smartphone apps and browser plugins, 
  and analyze transcripts from interviews. We have also had junior volunteers contribute 
  to our research by helping with study coordination and data collection."

- question: "What is the expected time commitment for doing research?"
  answer: "We generally do not recommend pursuing research if you have a heavy 
  course load or a concurrent internship. We do not keep track of the amount of 
  time people spend doing research, but the more time you spend doing research, 
  the more likely you are to get something out of it. We use weekly mentor meetings 
  to check that progress is being made at a reasonable rate. Note that in some cases, 
  some volunteers may need to be available at specific times of the day to help with 
  running user studies."

- question: "What skills should I have if I am applying to the CHAI Lab?"
  answer: "The best ability is availability. Beyond that, the skills that we need 
  at any given moment can vary depending on project openings. We have projects that 
  require expertise in data science, software development, and running user studies. 
  As long as you have experience in one of those topics, or have the time and willingness 
  to build that experience, we encourage you to apply."

- question: "How do I apply to work with the CHAI Lab?"
  answer: 'We encourage interested students to complete this 
  <a href="https://forms.gle/wtVBSZthCivAuZ5W6" target="_blank">Google Form</a>. 
  Whenever we are in need of a research volunteer, we interview people who have 
  filled out the form within the past 3-4 months to see if they would be a good fit. 
  If the timing works out, these volunteer positions can be converted into 
  research-for-credit courses (e.g., CSC 494/495). We also occasionally advertise openings 
  through NSERC Undergraduate Student Research Awards (USRA) and University of Toronto 
  Excellence Awards (UTEA), which offer funding support for students to do research over 
  the summer. These positions are typically advertised well before the start of the summer, 
  so keep an eye out for those emails from the Undergraduate Office.'

- question: "Can I work in the CHAI Lab if I'm not at the University of Toronto?"
  answer: 'Because of how we advertise openings, we generally prioritize working 
  with volunteers at the University of Toronto. This is also a necessity for projects 
  that require people to be available on campus to run studies. If you are still 
  interested in applying, you are welcome to express interest by completing this 
  <a href="https://forms.gle/wtVBSZthCivAuZ5W6" target="_blank">Google Form</a>.'

- question: "What would make my application stand out?"
  answer: "Doing well in your courses is always a great start, but we love to see 
  people who demonstrate a willingness to work on fun projects outside of the classroom. 
  For example, showing that you built a smartphone app for a club or that you took the 
  time to improve upon a course project before publishing it on GitHub are great ways of 
  showing that you are willing to take initiative."